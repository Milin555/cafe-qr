<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe QR</title>
<style>
:root{color-scheme:light dark;--bg:#EFE7D7;--fg:#22214C;--mut:#6B6893;--card:#FDFAF3;--edge:#E4D9C2}
@media (prefers-color-scheme:dark){:root{--bg:#08071A;--fg:#F3EDE0;--mut:#9C98C4;--card:#100F28;--edge:#2A2856}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:34rem;text-align:center}
h1{font-size:1.5rem;margin:0 0 .4rem;letter-spacing:-.01em}
p{color:var(--mut);margin:0 0 1.6rem}
a.card{display:block;background:var(--card);border:1px solid var(--edge);border-radius:14px;
padding:18px 20px;text-align:left;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-2px);border-color:var(--mut)}
b{display:block;font-size:1.05rem}small{color:var(--mut)}
</style></head><body><main>
<h1>Cafe QR</h1>
<p>QR menus for independent cafes in Surat.</p>
<a class="card" href="sorriso/"><b>Sorriso Cafe</b><small>Nana Varachha, Surat — 96 items</small></a>
</main></body></html>
