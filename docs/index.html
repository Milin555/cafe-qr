<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe QR</title>
<style>
:root{color-scheme:light;--bg:#EDE7DA;--fg:#232150;--mut:#6C6893;--card:#FBF8F1;--edge:#E0D7C3}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px}
main{max-width:34rem;width:100%}
h1{font-size:1.35rem;margin:0 0 .3rem;letter-spacing:-.01em;text-align:center}
.sub{color:var(--mut);margin:0 0 1.8rem;font-size:.92rem;text-align:center}
a.card{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
background:var(--card);border:1px solid var(--edge);border-radius:14px;
padding:16px 18px;margin-bottom:10px;color:inherit;text-decoration:none;
transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-2px);border-color:var(--mut)}
b{font-size:1.02rem;display:block}small{color:var(--mut);font-size:.83rem}
.n{color:var(--mut);font-size:.8rem;white-space:nowrap}
.foot{margin-top:22px;text-align:center;color:var(--mut);font-size:.78rem;line-height:1.7}
</style></head><body><main>
<h1>Cafe QR</h1>
<p class="sub">QR menus for independent cafes in Surat.</p>
<a class="card" href="sorriso/"><span><b>Sorriso Cafe</b><small>Specialty coffee &amp; Neapolitan pizza · 307</small></span><span class="n">96 items</span></a>
<a class="card" href="cafebeats/"><span><b>Café Beats</b><small>Cafe &amp; kitchen, coffee with music</small></span><span class="n">165 items</span></a>
<a class="card" href="kaldisgoat/"><span><b>Kaldi's Goat</b><small>Brew bar — V60, Chemex, syphon · 306</small></span><span class="n">75 items</span></a>
<p class="foot">Demos built from public listings.<br>Not commissioned by the cafes.</p>
</main></body></html>
