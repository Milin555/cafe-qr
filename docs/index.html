<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe QR</title>
<style>
:root{color-scheme:light;--bg:#EDE7DA;--fg:#232150;--mut:#6C6893;--card:#FBF8F1;--edge:#E0D7C3}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px}
main{max-width:34rem;width:100%;text-align:center}
h1{font-size:1.4rem;margin:0 0 .3rem;letter-spacing:-.01em}
p{color:var(--mut);margin:0 0 1.8rem;font-size:.94rem}
a.card{display:block;background:var(--card);border:1px solid var(--edge);border-radius:14px;
padding:16px 18px;margin-bottom:10px;text-align:left;color:inherit;text-decoration:none;
transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-2px);border-color:var(--mut)}
b{display:block;font-size:1.02rem}small{color:var(--mut);font-size:.84rem}
</style></head><body><main>
<h1>Cafe QR</h1>
<p>QR menus for independent cafes in Surat.</p>
<a class="card" href="sorriso/"><b>Sorriso Cafe</b><small>Nana Varachha · 96 items · specialty coffee</small></a>
<a class="card" href="cafebeats/"><b>Café Beats</b><small>Nana Varachha · 165 items · cafe &amp; kitchen</small></a>
</main></body></html>
